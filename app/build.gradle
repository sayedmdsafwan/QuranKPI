plugins {
    id 'com.android.application'
}

android {
    namespace 'com.safwan.qurankpi'
    compileSdk 34

    defaultConfig {
        applicationId "com.safwan.qurankpi"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "0.0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
